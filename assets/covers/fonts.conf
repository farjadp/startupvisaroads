<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "fonts.dtd">
<!-- Fonts for the code-drawn article covers (lib/cover-art). Loaded through
     FONTCONFIG_FILE so Pango finds every face by family name; sharp's
     per-call `fontfile` only registers the first file a process asks for. -->
<fontconfig>
  <dir prefix="relative">fonts</dir>
  <cachedir prefix="xdg">fontconfig</cachedir>
  <cachedir>/tmp/visaroads-fontconfig</cachedir>
</fontconfig>
